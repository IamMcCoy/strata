repos:
  -   repo: https://github.com/pre-commit/pre-commit-hooks
      rev: v6.0.0
      hooks:
        -   id: trailing-whitespace
        -   id: end-of-file-fixer
        -   id: check-yaml
            args: [--allow-multiple-documents]
        -   id: debug-statements
        -   id: double-quote-string-fixer
        -   id: name-tests-test
            args: [--pytest-test-first]
  -   repo: https://github.com/asottile/reorder-python-imports
      rev: v3.16.0
      hooks:
        -   id: reorder-python-imports
            args: [--py312-plus, --add-import, 'from __future__ import annotations']
  -   repo: https://github.com/asottile/add-trailing-comma
      rev: v4.0.0
      hooks:
        -   id: add-trailing-comma
  -   repo: https://github.com/asottile/pyupgrade
      rev: v3.21.2
      hooks:
        -   id: pyupgrade
            args: [--py312-plus]
  -   repo: https://github.com/hhatto/autopep8
      rev: v2.3.2
      hooks:
        -   id: autopep8
  -   repo: https://github.com/PyCQA/flake8
      rev: 7.3.0
      hooks:
        -   id: flake8
  -   repo: https://github.com/pre-commit/mirrors-mypy
      rev: v1.19.1
      hooks:
        -   id: mypy
            args: [--config-file=pyproject.toml, --no-strict-optional]
            additional_dependencies: [openai, anthropic, google-genai, pytest, python-dotenv, redis]
            # stage된 파일명을 넘기면 pyproject의 files=[src,tests]가 덮어써져서
            # src가 없는 커밋에서 `import strata`를 해결하지 못한다. 항상 설정대로 검사한다.
            pass_filenames: false
