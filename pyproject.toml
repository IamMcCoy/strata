[project]
name = "strata"
version = "0.0.1"
description = "A composable runtime for agentic systems"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pytest", "pre-commit"]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/strata"]
