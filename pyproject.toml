[project]
name = "strata"  # PyPI 배포 시 결정된 배포명으로 변경 (import명 strata는 유지)
version = "0.0.1"
description = "A composable runtime for agentic systems"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.urls]
Repository = "https://github.com/IamMcCoy/strata"

[project.optional-dependencies]
openai = ["openai>=1.50"]

[dependency-groups]
# redis는 dev 전용 — RedisMemory는 클라이언트를 주입받으므로 런타임 의존성이 아니다
dev = ["pytest", "pre-commit", "openai>=1.50", "python-dotenv", "redis>=5"]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/strata"]
